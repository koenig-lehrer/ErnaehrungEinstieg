<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Die Ernährungspyramide</title>
<style>
:root{--blue:#1769aa;--dark:#14324b;--bg:#edf5fa;--green:#b9dfb2;--yellow:#ffe39a;--red:#ffc0bc;--shadow:0 5px 18px #17364d1c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--dark);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;z-index:20;top:0;background:#fff;border-bottom:1px solid #d6e4ec;padding:18px 4%;transition:.25s}.top.compact{padding:7px 4%}.head{max-width:1100px;margin:auto;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}.logo{font-size:43px;transition:.25s}.compact .logo{font-size:25px}.top h1{font-size:clamp(27px,4vw,42px);margin:0;color:var(--blue);transition:.25s}.compact h1{font-size:21px}.intro{grid-column:1/-1;margin:0;transition:.2s}.compact .intro{display:none}.progressrow{grid-column:1/-1;display:flex;gap:12px;align-items:center}.bar{height:15px;flex:1;background:#dae6ed;border-radius:20px;overflow:hidden}.compact .bar{height:7px}.bar>i{display:block;height:100%;width:0;background:#35a45f;transition:.3s}.count{font-weight:800;white-space:nowrap}.steps{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.step{padding:5px;background:#e8f0f5;text-align:center;border-radius:8px;font-size:13px;font-weight:800}.step.done{background:#ccebd6}.compact .step{padding:2px;font-size:11px}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.panel{position:relative;background:#fff;border-radius:22px;padding:clamp(18px,4vw,36px);margin:20px 0;box-shadow:var(--shadow);scroll-margin-top:130px}.panel h2{color:var(--blue);margin-top:0}.lock{position:absolute;inset:0;z-index:6;border-radius:22px;background:#e9f0f4db;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:900;padding:20px}.panel.open .lock{display:none}.foods,.choices,.groupcards{display:flex;flex-wrap:wrap;gap:10px}.food,.choice,.groupcard,.target,.meal,.filter{border:2px solid #c9d9e3;background:#fff;border-radius:14px;padding:12px;min-height:52px;font:inherit;font-weight:750;color:inherit;cursor:pointer;touch-action:manipulation}.food{min-width:106px}.food.selected{border:4px solid var(--blue);background:#fff;transform:translateY(-2px)}.food.used{opacity:.35;pointer-events:none}.target{display:block;width:100%;margin:9px 0;text-align:left;min-height:66px}.target.selected-target{outline:4px solid #2878bc}.target small{display:block;font-weight:500}.btn{border:0;border-radius:14px;padding:13px 19px;background:var(--blue);color:#fff;font:inherit;font-weight:850;cursor:pointer;margin-top:14px;min-height:52px}.btn:disabled{opacity:.45;cursor:not-allowed}.msg{min-height:28px;margin:10px 0;font-weight:800}.counter{font-weight:900;color:var(--blue)}.personal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bucket{background:#f5f9fc;border:2px dashed #97b8ca;border-radius:16px;padding:12px;min-height:130px}.bucket h3{margin-top:0}.bucket .food{display:block;width:100%;margin:7px 0}.pyramid{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:18px}.pyr{min-height:72px;text-align:center}.pyr:nth-child(1){width:35%;background:var(--red)}.pyr:nth-child(2){width:45%;background:var(--yellow)}.pyr:nth-child(3){width:55%;background:var(--yellow)}.pyr:nth-child(4){width:62%;background:var(--yellow)}.pyr:nth-child(5){width:70%;background:var(--yellow)}.pyr:nth-child(6){width:80%;background:var(--green)}.pyr:nth-child(7){width:90%;background:var(--green)}.pyr:nth-child(8){width:100%;background:var(--green)}.traffic{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.traffic .bucket:nth-child(1){background:var(--green)}.traffic .bucket:nth-child(2){background:var(--yellow)}.traffic .bucket:nth-child(3){background:var(--red)}.question{border-top:1px solid #dce8ee;padding:15px 0}.choice{margin:4px}.choice.correct{border-color:#279653;background:#e1f5e7}.choice.wrong{border-color:#c63535}.groupcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.groupcard{cursor:default}.big{font-size:29px;color:var(--blue);font-weight:900}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.compare .bucket{border-style:solid}.mealgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.meal{min-height:110px;text-align:left}.meal .food{display:inline-block;margin:5px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter.active{background:var(--blue);color:#fff}.finish{background:#def4e5;border-radius:16px;padding:18px;font-weight:850;margin-top:18px}.tiny{font-size:14px;color:#526b7b}@media(max-width:720px){.personal,.traffic,.compare,.mealgrid{grid-template-columns:1fr}.pyr{width:100%!important}.top{padding:10px}.steps .step span{display:none}.panel{border-radius:16px}.food{min-width:95px;padding:10px}}
</style>
</head><body>
<header class="top" id="top"><div class="head"><div class="logo">🍎</div><h1>Die Ernährungspyramide</h1><p class="intro">Alles auf einer Seite. Der nächste Bereich wird freigeschaltet, wenn du den vorherigen geschafft hast.</p><div class="progressrow"><div class="bar"><i id="bar"></i></div><div class="count" id="overall">0 von 8 Bereichen geschafft</div></div><div class="steps" id="steps"></div></div></header>
<main class="wrap" id="app"></main>
<script>
(()=>{'use strict';
const GROUPS=[['Getränke','🥤',6,'etwa 1 großes Glas','green'],['Obst und Gemüse','🍎',5,'1 Hand voll, klein geschnitten etwa 2 Hände','green'],['Brot, Getreide und Beilagen','🍞',4,'1–2 Scheiben Brot oder etwa 2 Hände','green'],['Milch und Milchprodukte','🥛',2,'1 Glas oder 1 Becher','yellow'],['Nüsse und Saaten','🥜',1,'eine kleine Hand voll','yellow'],['Hülsenfrüchte / Fleisch / Fisch / Ei','🥚',1,'etwa so groß wie deine Handfläche','yellow'],['Öle und Fette','🫒',2,'etwa 1 Esslöffel','yellow'],['Extras','🍫',1,'eine kleine Menge','red']];
const icons={Brot:'🍞',Müsli:'🥣',Apfel:'🍎',Banane:'🍌',Joghurt:'🥛',Käse:'🧀',Nudeln:'🍝',Reis:'🍚',Burger:'🍔',Pizza:'🍕',Schokolade:'🍫',Chips:'🥔',Wasser:'💧',Saft:'🧃',Cola:'🥤',Döner:'🥙',Sushi:'🍣','ungesüßter Tee':'🫖',Karotte:'🥕',Vollkornbrot:'🍞',Nüsse:'🥜',Ei:'🥚',Fisch:'🐟',Öl:'🫒',Butter:'🧈',Tee:'🫖',Gurke:'🥒',Kartoffeln:'🥔',Salat:'🥗',Yufka:'🌯',Pommes:'🍟'};
const state={done:Array(8).fill(false),selected:null,prefs:{},attempts:{},solved:{}};
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(n,extra=''){return `<button class="food ${extra}" data-food="${esc(n)}">${icons[n]||'🍽️'} ${esc(n)}</button>`}
function panel(n,title,html){return `<section class="panel ${n===1?'open':''}" id="s${n}"><div class="lock">🔒 Erst Bereich ${n-1} abschließen</div><h2>${n}. ${title}</h2>${html}</section>`}
let html='';
const f1=['Brot','Müsli','Apfel','Banane','Joghurt','Käse','Nudeln','Reis','Burger','Pizza','Schokolade','Chips','Wasser','Saft','Cola'];
html+=panel(1,'Was hast du heute schon gegessen?',`<p>Tippe alles an, was passt.</p><div class="foods" id="f1">${f1.map(x=>card(x)).join('')}</div><p class="msg" id="m1"></p><button class="btn" id="b1" disabled>Bereich 1 abschließen</button>`);
const f2=['Burger','Döner','Pizza','Sushi','Chips','Schokolade','Cola','Wasser','Apfel','Brot','Joghurt','Banane'];
html+=panel(2,'Was magst du?',`<p>Lebensmittel antippen, dann ein Feld antippen.</p><p class="counter" id="c2">0 von 12 eingeordnet</p><div class="foods" id="f2">${f2.map(x=>card(x)).join('')}</div><div class="personal">${['😍 Mag ich richtig gern','🙂 Mag ich manchmal','😐 Eher selten'].map((x,i)=>`<button class="bucket target" data-pref="${i}"><h3>${x}</h3></button>`).join('')}</div><button class="btn" id="b2" disabled>Bereich 2 abschließen</button>`);
const f3=[['Wasser',0],['ungesüßter Tee',0],['Apfel',1],['Karotte',1],['Vollkornbrot',2],['Nudeln',2],['Joghurt',3],['Käse',3],['Nüsse',4],['Ei',5],['Fisch',5],['Öl',6],['Butter',6],['Schokolade',7],['Chips',7],['Cola',7]];
const pyrOrder=[7,6,5,4,3,2,1,0];
html+=panel(3,'Baue die Ernährungspyramide',`<p>Lebensmittel antippen, dann die passende Ebene.</p><p class="counter" id="c3">0 von 16 richtig eingeordnet</p><div class="foods" id="f3">${f3.map(x=>card(x[0])).join('')}</div><p class="msg" id="m3"></p><div class="pyramid">${pyrOrder.map(i=>`<button class="target pyr" data-group="${i}"><strong>${GROUPS[i][1]} ${GROUPS[i][0]}</strong><small></small></button>`).join('')}</div>`);
html+=panel(4,'Grün, Gelb oder Rot?',`<p>🟢 viel &nbsp; 🟡 mäßig &nbsp; 🔴 sparsam. <strong>Rot bedeutet nicht verboten.</strong></p><p class="counter" id="c4">0 von 8 richtig eingeordnet</p><div class="foods" id="f4">${GROUPS.map((g,i)=>`<button class="food" data-gi="${i}">${g[1]} ${g[0]}</button>`).join('')}</div><p class="msg" id="m4"></p><div class="traffic">${[['green','🟢 Grün'],['yellow','🟡 Gelb'],['red','🔴 Rot']].map(x=>`<button class="bucket target" data-color="${x[0]}"><h3>${x[1]}</h3></button>`).join('')}</div><div id="q4" hidden></div>`);
html+=panel(5,'Portionen und Handmaß',`<p>Deine Hand wächst mit dir. Darum ist sie ein praktisches Portionsmaß.</p><div class="groupcards">${GROUPS.map(g=>`<div class="groupcard"><div class="big">${g[1]} ${g[2]} Portion${g[2]>1?'en':''}</div><strong>${g[0]}</strong><br><span class="tiny">${g[3]}</span></div>`).join('')}</div><h3>Teste dein Wissen</h3><p class="counter" id="c5">0 von 5 Aufgaben gelöst</p><div id="q5"></div>`);
html+=panel(6,'Wissenscheck',`<p class="counter" id="c6">0 von 8 Fragen gelöst</p><div id="q6"></div>`);
html+=panel(7,'Vergleich mit deiner Auswahl',`<p>Dein Geschmack und die Ernährungspyramide können unterschiedlich aussehen. Die Pyramide hilft dir bei der Orientierung.</p><div class="compare" id="compare"></div><button class="btn" id="b7">Vergleich angesehen</button>`);
const dayFoods=['Wasser','Tee','Saft','Cola','Brot','Müsli','Joghurt','Apfel','Banane','Karotte','Gurke','Nüsse','Schokolade','Chips','Reis','Nudeln','Kartoffeln','Salat','Käse','Ei','Fisch','Öl','Burger','Döner','Yufka','Pizza','Sushi','Pommes'];
html+=panel(8,'Stell deinen Essenstag zusammen',`<p>Lebensmittel antippen, dann eine Mahlzeit antippen. Tippe ein eingesetztes Lebensmittel an, um es zu entfernen.</p><div class="filters">${['Alle','Getränke','Frühstück','Gerichte','Snacks','Zutaten'].map((x,i)=>`<button class="filter ${i?'':'active'}">${x}</button>`).join('')}</div><div class="foods" id="f8">${dayFoods.map(x=>card(x)).join('')}</div><div class="mealgrid">${['Frühstück','Snack am Vormittag','Mittagessen','Snack am Nachmittag','Abendessen','Getränke'].map((x,i)=>`<button class="meal target" data-meal="${i}"><strong>${x}</strong><div></div></button>`).join('')}</div><button class="btn" id="b8">Meinen Tag ansehen</button><div id="final"></div>`);
app.innerHTML=html; document.querySelector('#steps').innerHTML=Array.from({length:8},(_,i)=>`<div class="step" id="st${i}">${i+1}<span> · Bereich</span></div>`).join('');
function save(){try{localStorage.setItem('ernaehrungspyramide-v1',JSON.stringify({done:state.done,prefs:state.prefs}))}catch(e){}}
function progress(){const n=state.done.filter(Boolean).length;document.querySelector('#bar').style.width=(n/8*100)+'%';document.querySelector('#overall').textContent=`${n} von 8 Bereichen geschafft`;state.done.forEach((d,i)=>{document.querySelector('#st'+i).classList.toggle('done',d);if(d&&i<7)document.querySelector('#s'+(i+2)).classList.add('open')});save()}
function complete(i){if(state.done[i])return;state.done[i]=true;progress();if(i<7)setTimeout(()=>document.querySelector('#s'+(i+2)).scrollIntoView({behavior:'smooth'}),250)}
window.addEventListener('scroll',()=>document.querySelector('#top').classList.toggle('compact',scrollY>90),{passive:true});
document.querySelector('#f1').onclick=e=>{const b=e.target.closest('.food');if(!b)return;b.classList.toggle('selected');document.querySelector('#b1').disabled=!document.querySelector('#f1 .selected')};document.querySelector('#b1').onclick=()=>complete(0);
document.querySelector('#f2').onclick=selectFood;function selectFood(e){const b=e.target.closest('.food:not(.used)');if(!b)return;document.querySelectorAll('.food.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.selected=b}
document.querySelector('#s2 .personal').onclick=e=>{const t=e.target.closest('[data-pref]');if(!t||!state.selected)return;const b=state.selected,n=b.dataset.food;t.append(b);b.classList.remove('selected');state.prefs[n]=+t.dataset.pref;state.selected=null;document.querySelector('#c2').textContent=`${Object.keys(state.prefs).length} von 12 eingeordnet`;document.querySelector('#b2').disabled=Object.keys(state.prefs).length<12};document.querySelector('#b2').onclick=()=>{compare();complete(1)};
function wrong(key,msgEl,hint,auto){state.attempts[key]=(state.attempts[key]||0)+1;if(state.attempts[key]>=3){auto();msgEl.textContent='Die richtige Lösung wurde eingesetzt.'}else msgEl.textContent=state.attempts[key]===1?'Noch nicht. Schau noch einmal hin.':hint}
document.querySelector('#f3').onclick=selectFood;document.querySelector('#s3 .pyramid').onclick=e=>{const t=e.target.closest('[data-group]'),b=state.selected;if(!t||!b)return;const row=f3.find(x=>x[0]===b.dataset.food),key='p3'+row[0];const put=()=>{if(state.solved[key])return;state.solved[key]=1;b.classList.add('used');b.classList.remove('selected');t.querySelector('small').insertAdjacentHTML('beforeend',`<span> ${icons[row[0]]}</span>`);state.selected=null;const n=Object.keys(state.solved).filter(x=>x.startsWith('p3')).length;document.querySelector('#c3').textContent=`${n} von 16 richtig eingeordnet`;if(n===16)complete(2)};if(+t.dataset.group===row[1]){put();document.querySelector('#m3').textContent='Richtig!'}else wrong(key,document.querySelector('#m3'),`Tipp: Das gehört zu „${GROUPS[row[1]][0]}“.`,put)};
document.querySelector('#f4').onclick=e=>{const b=e.target.closest('[data-gi]');if(!b)return;document.querySelectorAll('.food.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.selected=b};document.querySelector('#s4 .traffic').onclick=e=>{const t=e.target.closest('[data-color]'),b=state.selected;if(!t||!b)return;const i=+b.dataset.gi,key='p4g'+i,put=()=>{if(state.solved[key])return;state.solved[key]=1;b.classList.add('used');b.classList.remove('selected');t.append(b.cloneNode(true));state.selected=null;const n=Object.keys(state.solved).filter(x=>x.startsWith('p4g')).length;document.querySelector('#c4').textContent=`${n} von 8 richtig eingeordnet`;if(n===8){document.querySelector('#q4').hidden=false}};if(t.dataset.color===GROUPS[i][4])put();else wrong(key,document.querySelector('#m4'),`Tipp: ${GROUPS[i][0]} gehört zu ${GROUPS[i][4]==='green'?'Grün':GROUPS[i][4]==='yellow'?'Gelb':'Rot'}.`,put)};
const q4=[['Warum ist Wasser bei Grün?',['Weil wir viel trinken sollen','Weil Wasser süß ist','Weil Wasser verboten ist'],0],['Warum stehen Milchprodukte bei Gelb?',['Wir brauchen davon eine mittlere Menge','Wir brauchen gar keine','Wir brauchen davon am meisten'],0],['Was bedeutet Rot bei Extras?',['Verboten','Nur sparsam genießen','So viel wie möglich'],1]];
const q5=[['___ Portionen Getränke am Tag.',['4','6','8'],1],['___ Portionen Obst und Gemüse am Tag.',['2','5','7'],1],['Getreide: ungefähr ___ Portionen.',['1','4','6'],1],['Milchprodukte: ungefähr ___ Portionen.',['1','2','5'],1],['Extras: ungefähr ___ Portion.',['1','3','6'],0]];
const q6=[['Was steht ganz unten?',['Getränke','Extras','Öle'],0],['Was steht ganz oben?',['Gemüse','Extras','Brot'],1],['Welche Farbe bedeutet „viel“?',['Rot','Gelb','Grün'],2],['Wie viele Portionen Obst und Gemüse?',['2','5','8'],1],['Wie viele Portionen Getränke?',['6','2','1'],0],['Was hilft beim Schätzen?',['Die Hand','Der Schuh','Das Handy'],0],['Was bedeutet Rot?',['Verboten','Sparsam','Sehr viel'],1],['Wozu dient die Pyramide?',['Zur Orientierung','Als Verbotsschild','Nur zum Rechnen'],0]];
function renderQuestions(id,qs,prefix,finish){const box=document.querySelector('#'+id);box.innerHTML=qs.map((q,i)=>`<div class="question" data-q="${i}"><strong>${q[0]}</strong><div class="choices">${q[1].map((a,j)=>`<button class="choice" data-a="${j}">${a}</button>`).join('')}</div><div class="msg"></div></div>`).join('');box.onclick=e=>{const b=e.target.closest('[data-a]'),row=e.target.closest('[data-q]');if(!b||!row)return;const i=+row.dataset.q,key=prefix+i;if(state.solved[key])return;const solve=()=>{if(state.solved[key])return;state.solved[key]=1;row.querySelectorAll('.choice')[qs[i][2]].classList.add('correct');row.querySelectorAll('.choice').forEach(x=>x.disabled=true);const n=Object.keys(state.solved).filter(x=>x.startsWith(prefix)).length;const c=document.querySelector('#c'+prefix.slice(1,2));if(c)c.textContent=`${n} von ${qs.length} ${prefix==='p6'?'Fragen':'Aufgaben'} gelöst`;if(n===qs.length)finish()};if(+b.dataset.a===qs[i][2])solve();else{b.classList.add('wrong');wrong(key,row.querySelector('.msg'),'Tipp: Lies die Antworten noch einmal.',solve)}}}
renderQuestions('q4',q4,'p4q',()=>complete(3));renderQuestions('q5',q5,'p5',()=>complete(4));renderQuestions('q6',q6,'p6',()=>{compare();complete(5)});
const map={Schokolade:'Extras',Wasser:'Getränke',Apfel:'Obst und Gemüse',Banane:'Obst und Gemüse',Brot:'Brot / Getreide / Beilagen',Joghurt:'Milchprodukte',Chips:'Extras',Cola:'Extras',Pizza:'mehrere Bereiche',Burger:'mehrere Bereiche',Sushi:'mehrere Bereiche',Döner:'Getreide, Fleisch/Fisch/Ei, Gemüse, Fette'};
function compare(){const titles=['😍 Mag ich richtig gern','🙂 Mag ich manchmal','😐 Eher selten'];document.querySelector('#compare').innerHTML=titles.map((t,i)=>`<div class="bucket"><h3>${t}</h3>${Object.entries(state.prefs).filter(x=>x[1]===i).map(x=>`<div class="food">${icons[x[0]]||'🍽️'} ${x[0]}<small>Pyramide: ${map[x[0]]||'mehrere Bereiche'}</small></div>`).join('')}</div>`).join('')}
document.querySelector('#b7').onclick=()=>complete(6);document.querySelector('#f8').onclick=selectFood;document.querySelector('#s8 .mealgrid').onclick=e=>{const t=e.target.closest('[data-meal]'),b=state.selected;if(!t||!b)return;t.querySelector('div').insertAdjacentHTML('beforeend',`<button class="food" data-added="1">${icons[b.dataset.food]||'🍽️'} ${b.dataset.food}</button>`);state.selected=null;b.classList.remove('selected')};document.querySelector('#s8 .mealgrid').addEventListener('click',e=>{const x=e.target.closest('[data-added]');if(x){e.stopPropagation();x.remove()}},true);document.querySelector('#b8').onclick=()=>{const all=[...document.querySelectorAll('[data-added]')].map(x=>x.textContent.trim());const drinks=all.some(x=>/Wasser|Tee|Saft|Cola/.test(x)),produce=all.filter(x=>/Apfel|Banane|Karotte|Gurke|Salat/.test(x)).length,extras=all.filter(x=>/Cola|Schokolade|Chips|Pommes/.test(x)).length;document.querySelector('#final').innerHTML=`<div class="finish">${drinks?'Du hast an Getränke gedacht.':'Schau noch einmal: Hast du genug Getränke?'}<br>${produce>=2?'Obst und Gemüse kommen vor.':'Obst und Gemüse könnten noch öfter vorkommen.'}<br>${extras>2?'Du hast viele Extras gewählt. Vielleicht ergänzt du noch etwas aus dem grünen Bereich.':'Dein Tag hat schon eine gute Mischung.'}<h3>Fertig! Du hast die Ernährungspyramide kennengelernt.</h3></div>`;complete(7)};
try{const old=JSON.parse(localStorage.getItem('ernaehrungspyramide-v1')||'{}');if(old.prefs)state.prefs=old.prefs;if(Array.isArray(old.done))state.done=old.done}catch(e){}compare();progress();
function selftest(){const checks=[];const ok=(n,v)=>checks.push([n,!!v]);ok('8 Bereiche',document.querySelectorAll('.panel').length===8);ok('16 Pyramidenkarten',f3.length===16);ok('8 Gruppen',GROUPS.length===8);ok('5 Portionsfragen',q5.length===5);ok('8 Wissensfragen',q6.length===8);ok('Touch-Ziele',[...document.querySelectorAll('.target')].length>=20);const oldScroll=window.scrollTo;for(let i=0;i<8;i++)state.done[i]=true;f2.forEach((x,i)=>state.prefs[x]=i%3);compare();progress();ok('Alle freigeschaltet',[...document.querySelectorAll('.panel')].every(x=>x.classList.contains('open')));ok('Bereich-2-Vergleich',document.querySelectorAll('#compare .food').length===12);window.SELFTEST_PASS=checks.every(x=>x[1]);window.SELFTEST_RESULTS=checks;document.body.insertAdjacentHTML('afterbegin',`<div style="position:relative;z-index:99;padding:12px;background:${window.SELFTEST_PASS?'#d8f3df':'#ffd8d8'};font-weight:900">${window.SELFTEST_PASS?'SELFTEST_PASS':'SELFTEST_FAIL'} · ${checks.map(x=>x[0]+': '+(x[1]?'✓':'✗')).join(' · ')}</div>`)}
if(new URLSearchParams(location.search).get('selftest')==='1')selftest();
})();
</script></body></html>
